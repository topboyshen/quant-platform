# quant-platform new app at /next/ (included inside the 443 server of nng8-dashboard-public).
# Own login (session cookie); no basic auth. API 401 when unauthenticated.
location = /next { auth_basic off; return 301 /next/; }
location ^~ /next/api/ {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;
    auth_basic off;
    limit_req zone=nng8_dashboard_ip burst=40 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18800/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
location ^~ /next/assets/ {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;
    auth_basic off;
    limit_req zone=nng8_dashboard_ip burst=80 nodelay;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /opt/qp/current/frontend/assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
location ^~ /next/ {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;
    auth_basic off;
    limit_req zone=nng8_dashboard_ip burst=80 nodelay;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /opt/qp/current/frontend/;
    try_files $uri $uri/ /next/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
}
