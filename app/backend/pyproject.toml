[project]
name = "qp"
version = "0.1.0"
description = "quant-platform unified backend (M1 skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1",
  "bcrypt>=4.1",
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
qp = "qp.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["qp*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
