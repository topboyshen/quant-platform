[Unit]
# OnSuccess belongs to [Unit]; in [Service] systemd silently ignores it and the
# nightly critical audit never alerts.
OnSuccess=research-data-health-alert.service

[Service]
StateDirectory=research-data-health
StateDirectoryMode=0750
ExecStart=
ExecStart=/usr/bin/python3 -B /home/ubuntu/research-data/data_health.py --db /home/ubuntu/research-data/snapshot.db --qlib /home/ubuntu/qlib/data/cn_data --stages /home/ubuntu/.local/state/research-data/akshare-market --last-run /home/ubuntu/.local/state/research-data/last-run.json --mode /etc/research-ledger/runtime-health.mode --since 2026-08-21 --monitor-since 2026-09-07 --baseline /home/ubuntu/research-data/config/data-health-row-baseline.json --output /var/lib/research-data-health/last.json
