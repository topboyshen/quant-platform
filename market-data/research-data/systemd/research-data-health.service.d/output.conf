[Unit]
# OnSuccess/OnFailure belong to [Unit]; in [Service] systemd silently ignores
# them and the nightly audit would never alert. The failure path is a different
# unit with the same script: listing one unit on both hooks makes systemd skip
# exit-status propagation ("multiple trigger source candidates").
OnSuccess=research-data-health-alert.service
OnFailure=research-data-health-alert-on-failure.service

[Service]
StateDirectory=research-data-health
StateDirectoryMode=0750
ExecStart=
ExecStart=/usr/bin/python3 -B /home/ubuntu/research-data/data_health.py --db /home/ubuntu/research-data/snapshot.db --qlib /home/ubuntu/qlib/data/cn_data --stages /home/ubuntu/.local/state/research-data/akshare-market --last-run /home/ubuntu/.local/state/research-data/last-run.json --mode /etc/research-ledger/runtime-health.mode --since 2026-08-21 --monitor-since 2026-09-07 --baseline /home/ubuntu/research-data/config/data-health-row-baseline.json --contract-policy /home/ubuntu/research-data/config/snapshot-contract.json --core-db /home/ubuntu/research-data/core-market.db --core-last-run /home/ubuntu/.local/state/research-data/core-market/last-run.json --calendar-project /home/ubuntu/AStock_AI_System --output /var/lib/research-data-health/last.json
