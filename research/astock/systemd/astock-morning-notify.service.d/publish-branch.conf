[Unit]
# A validated trading-calendar skip closes the source-to-seal daily-report
# publish branch. run-orchestrated-morning-cron.sh clears this marker before
# every run and writes it only when scripts/publish-branch-gate.mjs validates
# the skip (orchestrator state + last-run + hash-bound calendar context).
# A Condition skip is not a failure and starts no OnSuccess=/OnFailure=
# dependents: no daily report seal or Telegram daily notification is produced.
# An independently scheduled relay may emit the signed research_skip receipt;
# this marker does not disable that separate status-receipt contract.
# Rollback: delete this drop-in and `systemctl --user daemon-reload`.
ConditionPathExists=!/home/ubuntu/AStock_AI_System/work/orchestrator/publish-branch.closed
