[pytest]
markers =
    integration: optional live exchange API smoke tests (requires your own testnet keys in env)
filterwarnings =
    ; eventkit 1.0.3 (ib-insync 依赖，已是最新版) 在导入时调用
    ; asyncio.get_event_loop_policy().get_event_loop()，第三方代码无法修复，
    ; 仅屏蔽这一条特定消息，其余警告照常显示。
    ignore:There is no current event loop:DeprecationWarning:eventkit.util
