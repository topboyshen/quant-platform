name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pgserver
      - name: Test
        env:
          QP_TEST_PGDATA: ${{ runner.temp }}/qp-pgdata
        run: python -m pytest -q

  security-and-lint:
    name: security and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff syntax / undefined-name gate
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check app/backend --select E9,F63,F7,F82

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  frontend-smoke:
    name: frontend smoke (login + top-level pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install backend
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pgserver
      - name: Install frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run smoke
        env:
          QP_TEST_PGDATA: ${{ runner.temp }}/qp-smoke-pgdata
          QP_COOKIE_SECURE: "0"
        run: |
          set -euo pipefail
          cd app/backend
          python - <<'PY'
          import io
          import os
          import sys

          import bcrypt
          import pgserver

          pg = os.environ["QP_TEST_PGDATA"]
          srv = pgserver.get_server(pg, cleanup_mode=None)
          srv.psql("CREATE DATABASE qp_smoke;")
          os.environ["QP_DATABASE_URL"] = f"postgresql+psycopg://postgres@/qp_smoke?host={pg}"
          from qp.cli import main
          assert main(["db", "upgrade"]) == 0
          digest = bcrypt.hashpw(b"correct horse battery staple", bcrypt.gensalt(rounds=4)).decode()
          sys.stdin = io.StringIO(f"admin\t{digest}\n")
          assert main(["user", "import-legacy", "--stdin"]) == 0
          PY
          export QP_DATABASE_URL="postgresql+psycopg://postgres@/qp_smoke?host=$QP_TEST_PGDATA"
          python -m uvicorn qp.api.main:app --host 127.0.0.1 --port 18800 &
          api=$!
          cd ../frontend
          npm run preview -- --host 127.0.0.1 --port 18080 --strictPort &
          preview=$!
          trap 'kill $api $preview 2>/dev/null || true' EXIT
          timeout 30s bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:18800/api/health; do sleep 0.5; done'
          timeout 30s bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:18080/next/; do sleep 0.5; done'
          QP_SMOKE_BASE_URL=http://127.0.0.1:18080/next/ npm run smoke

