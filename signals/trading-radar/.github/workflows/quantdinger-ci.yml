name: QuantDinger Backend CI

on:
  push:
    branches: [master]
    paths:
      - "QuantDinger/backend_api_python/**"
      - "QuantDinger/VERSION"
      - "docker-compose.quantdinger.yml"
      - ".github/workflows/quantdinger-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "QuantDinger/backend_api_python/**"
      - "QuantDinger/VERSION"
      - "docker-compose.quantdinger.yml"
      - ".github/workflows/quantdinger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuantDinger/backend_api_python
    env:
      SKIP_STARTUP_HOOKS: "1"
      SECRET_KEY: "ci-only-secret-key-with-at-least-32-characters"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: QuantDinger/backend_api_python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "MetaTrader5" requirements.txt > /tmp/quantdinger-requirements-ci.txt
          python -m pip install -r /tmp/quantdinger-requirements-ci.txt
          python -m pip install pytest

      - name: Compile backend
        run: |
          python -m py_compile run.py
          python -m compileall -q app scripts

      - name: Run backend suite
        run: python -m pytest -q --ignore=tests/test_backend_quality_check.py

  monorepo-paths:
    name: Monorepo path contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify embedded QuantDinger paths
        run: |
          test -f QuantDinger/backend_api_python/migrations/init.sql
          test -f QuantDinger/LICENSE
          grep -Fq '${QUANTDINGER_ROOT:-./QuantDinger}' docker-compose.quantdinger.yml
