[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-radar"
version = "2.0.0"
description = "A-share monitoring, ML/RL tooling, and dashboard"
readme = "README.md"
requires-python = ">=3.11"
# 始终需要的最小核心运行时依赖（monitor / dashboard / serve / ci 都要）
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
    "tenacity>=8.2.0",
    "aiohttp>=3.9.0",
    "cachetools>=5.0.0",
]

# 细粒度 extras：按子系统分。Docker / systemd / CI 组合见下面的复合 extras。
# 安装示例:
#   pip install -e ".[monitor]"        # 监控主进程（slim, 无 torch）
#   pip install -e ".[monitor,rl]"     # 监控 + 进程内 RL（含 PyTorch ~4GB）
#   pip install -e ".[dashboard]"      # Flask Dashboard
#   pip install -e ".[ml-serve]"       # ML 推理服务
#   pip install -e ".[monitor-full]"   # 监控 + 进程内 RL + 可视化（Docker full）
#   pip install -e ".[all]"            # 全量（CPU torch 仍需手动按 README 步骤装）
[project.optional-dependencies]
schema = ["pandera>=0.18.0", "pydantic>=2.4.0"]
metrics = ["prometheus-client>=0.20.0"]
kline = ["pyarrow>=15.0.0"]
ml = ["scikit-learn>=1.3.0"]
rl = [
    "torch",
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.29.0",
    "cloudpickle>=2.0.0",
]
dashboard = [
    "trading-radar[schema,kline]",
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
    "akshare>=1.13.0",
]
serve = ["redis>=5.0.0", "pymemcache>=4.0.0"]
viz = ["matplotlib>=3.7.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

# 复合 extras（对应 Docker 镜像与 ci.yml）。
# self-referential 在 setuptools>=61 + pip>=21.2 上支持。
monitor = [
    "trading-radar[schema,metrics,kline,ml]",  # = Dockerfile.monitor-slim
]
monitor-full = [
    "trading-radar[monitor,rl,dashboard,serve,viz]",
]
ml-serve = [
    "trading-radar[metrics,ml,serve,dashboard]",  # serve_ml 用 flask 暴露 /v1/predict
    "grpcio>=1.60.0",
]
ci = [
    "trading-radar[schema,metrics,kline,ml,dashboard,dev]",
]
all = [
    "trading-radar[schema,metrics,kline,ml,rl,dashboard,serve,viz,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
# `radar*` intentionally includes both `radar` and the lightweight `radar_pro`
# package. Standalone legacy scripts and mx_client remain source-tree helpers.
include = ["radar*", "runtime_contracts*"]

[tool.pytest.ini_options]
addopts = "--cov=radar --cov=dashboard --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "radar/strategy/rl_*.py",
    "radar/ml_serve/grpc_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
# 与 pyrightconfig.json / Dockerfile / ci.yml 矩阵保持一致
target-version = "py311"
line-length = 120
exclude = [
    "venv",
    ".venv",
    ".trash",
    "legacy",
    "radar_pro",      # 历史脚本，不在 lint 范围内
    "trading_radar.egg-info",
]

[tool.ruff.lint]
# 当前启用：pyflakes(F) + pycodestyle E + W (whitespace) + isort (I)
# F 已抓出 2 个生产 bug（grpc_serve / api_protection 错误处理路径 NameError）。
# 后续单独 PR 再 enable：
#   - B (bugbear) / UP (pyupgrade) / SIM (simplify) — 视收益逐步放开
select = ["E", "F", "I", "W"]
# E501 line too long 由 formatter 处理；E741 ambiguous var name 在历史代码里
# 偶有 `l` / `O` 命名，CI 阶段不强制。
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture override 是合法模式；测试里允许紧凑的单行 setup。
"tests/*" = ["F811", "E701", "E702"]
