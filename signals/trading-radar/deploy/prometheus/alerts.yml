              and on(job,instance) (qd_sync_success_seen{job="node-exporter",instance="node-exporter:9100",unit="quant-nng8-sync"} == 1)
              and on(job,instance) (qd_unit_last_success_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",unit="quant-nng8-sync"} > 0)
              and on(job,instance) (qd_unit_last_success_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",unit="quant-nng8-sync"} <= (time() + 5))
              and on(job,instance) (qd_log_collector_heartbeat_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",role="host"} > 0)
              and on(job,instance) (qd_log_collector_heartbeat_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",role="host"} <= (time() + 5))
              and on(job,instance) ((qd_log_collector_raw_persisted{job="node-exporter",instance="node-exporter:9100",role="host"} == 0 or qd_log_collector_raw_persisted{job="node-exporter",instance="node-exporter:9100",role="host"} == 1))
              and on(job,instance) (qd_log_collector_heartbeat_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",role="frontend"} > 0)
              and on(job,instance) (qd_log_collector_heartbeat_timestamp_seconds{job="node-exporter",instance="node-exporter:9100",role="frontend"} <= (time() + 5))
              and on(job,instance) ((qd_log_collector_raw_persisted{job="node-exporter",instance="node-exporter:9100",role="frontend"} == 0 or qd_log_collector_raw_persisted{job="node-exporter",instance="node-exporter:9100",role="frontend"} == 1))
              )
            )
            or (time() - qd_ops_metrics_last_run_timestamp_seconds{job="node-exporter",instance="node-exporter:9100"} > 300))
          )
