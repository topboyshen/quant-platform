global:
  scrape_interval: 15s


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: quantdinger-radar-macro-risk
    metrics_path: /metrics
    static_configs:
      - targets:
          - macro-risk-producer:8093
        labels:
          service: radar_macro_risk

  - job_name: prometheus-self
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus

  - job_name: quant-runtime-freshness
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: [runtime-observer:9116]
        labels:
          service: radar_runtime_freshness

  - job_name: quant-runtime-http
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    static_configs:
      - targets: [backend, frontend, grafana]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        target_label: service
      - target_label: __address__
        replacement: runtime-observer:9116

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          service: host_node

  - job_name: alertmanager
    scrape_interval: 30s
    static_configs:
      - targets: [alertmanager:9093]
        labels:
          service: alertmanager
