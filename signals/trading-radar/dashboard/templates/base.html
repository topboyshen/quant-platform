<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Radar 监控仪表板{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f2e;
            --bg-hover: #243047;
            --border: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-brand i {
            font-size: 28px;
            color: var(--accent-cyan);
        }

        .nav-brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .nav-links a.active {
            color: var(--accent-cyan);
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .last-update {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .stat-card.blue::before { background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); }
        .stat-card.green::before { background: linear-gradient(90deg, var(--accent-green), #34d399); }
        .stat-card.yellow::before { background: linear-gradient(90deg, var(--accent-yellow), #fbbf24); }
        .stat-card.red::before { background: linear-gradient(90deg, var(--accent-red), #f87171); }
        .stat-card.purple::before { background: linear-gradient(90deg, var(--accent-purple), #a78bfa); }
        .stat-card.cyan::before { background: linear-gradient(90deg, var(--accent-cyan), #67e8f9); }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-title {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .stat-icon.green { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .stat-icon.yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
        .stat-icon.cyan { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-value.blue { color: var(--accent-blue); }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.yellow { color: var(--accent-yellow); }
        .stat-value.red { color: var(--accent-red); }
        .stat-value.purple { color: var(--accent-purple); }
        .stat-value.cyan { color: var(--accent-cyan); }

        .stat-detail {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 图表容器 */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
        }

        .chart-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chart-container {
            position: relative;
            height: 250px;
        }

        /* 工具状态列表 */
        .tools-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .tool-item:hover {
            border-color: var(--border);
        }

        .tool-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tool-status.ok { background: var(--accent-green); }
        .tool-status.error { background: var(--accent-red); }

        .tool-info h4 {
            font-size: 14px;
            font-weight: 500;
        }

        .tool-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 股票列表 */
        .stocks-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .stock-list {
            list-style: none;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s;
        }

        .stock-item:last-child {
            border-bottom: none;
        }

        .stock-item:hover {
            background: var(--bg-hover);
            border-radius: 8px;
        }

        .stock-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stock-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .stock-name-code h4 {
            font-size: 15px;
            font-weight: 600;
        }

        .stock-name-code span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stock-tags {
            display: flex;
            gap: 6px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .tag.ml { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
        .tag.rl { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
        .tag.direction { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }

        .trigger-dir {
            display: inline-block;
            font-weight: bold;
            margin-right: 4px;
        }

        .trigger-up { color: var(--accent-red); }
        .trigger-down { color: var(--accent-green); }

        .stock-trigger {
            text-align: right;
        }

        .stock-trigger .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .stock-trigger .label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-fill.blue { background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); }
        .progress-fill.green { background: linear-gradient(90deg, var(--accent-green), #34d399); }
        .progress-fill.yellow { background: linear-gradient(90deg, var(--accent-yellow), #fbbf24); }
        .progress-fill.red { background: linear-gradient(90deg, var(--accent-red), #f87171); }

        /* 实时股价卡片 - v3.1 优化 */
        .stock-cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        @media (max-width: 1400px) {
            .stock-cards-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .stock-cards-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .stock-cards-grid { grid-template-columns: 1fr; }
        }

        .stock-price-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .stock-price-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stock-price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .stock-price-card.up::before { background: linear-gradient(90deg, #ef4444, #f87171); }
        .stock-price-card.down::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .stock-price-card.neutral::before { background: linear-gradient(90deg, #6b7280, #9ca3af); }

        .stock-price-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .stock-price-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stock-price-code {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .stock-price-main {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 8px 0;
        }

        .stock-price-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .stock-price-change {
            font-size: 16px;
            font-weight: 600;
        }

        .stock-price-change.up { color: #ef4444; }
        .stock-price-change.down { color: #10b981; }
        .stock-price-change.neutral { color: #6b7280; }

        .stock-price-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .stock-price-volume {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stock-price-trigger {
            font-size: 12px;
            color: var(--accent-yellow);
        }
        .change-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .change-badge.up { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .change-badge.down { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .change-badge.neutral { background: rgba(107, 114, 128, 0.15); color: #6b7280; }

        .stock-price-detail {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar-mini {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill-mini {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .progress-fill-mini.up { background: #ef4444; }
        .progress-fill-mini.down { background: #10b981; }
        .progress-fill-mini.neutral { background: #6b7280; }

        /* 股票表格 */
        .stock-table-container {
            overflow-x: auto;
        }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stock-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .stock-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .stock-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .stock-table .price-cell,
        .stock-table .change-cell,
        .stock-table .distance-cell {
            font-weight: 600;
        }

        .stock-table .up { color: #ef4444; }
        .stock-table .down { color: #10b981; }
        .stock-table .neutral { color: #6b7280; }

        /* 持仓卡片 */
        .portfolio-section {
            margin-top: 24px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .portfolio-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .portfolio-name {
            font-size: 15px;
            font-weight: 600;
        }

        .portfolio-shares {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .portfolio-prices {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
        }

        .price-item {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .price-value {
            font-size: 18px;
            font-weight: 600;
        }

        .portfolio-pnl {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .portfolio-pnl.up {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .portfolio-pnl.down {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .pnl-amount {
            font-size: 20px;
        }

        .pnl-pct {
            font-size: 14px;
        }

        /* 加载文字 */
        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        /* 市场情绪卡片 */
        .sentiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .sentiment-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .sentiment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .sentiment-card.bullish { border-left: 4px solid #ef4444; }
        .sentiment-card.bearish { border-left: 4px solid #10b981; }
        .sentiment-card.neutral { border-left: 4px solid #6b7280; }

        .sentiment-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .sentiment-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sentiment-value.bullish { color: #ef4444; }
        .sentiment-value.bearish { color: #10b981; }
        .sentiment-value.neutral { color: #6b7280; }

        .sentiment-change {
            font-size: 14px;
            font-weight: 600;
        }

        /* 资金流向弹窗 */
        .flow-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .flow-modal.active {
            display: flex;
        }

        .flow-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .flow-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .flow-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .flow-row:last-child {
            border-bottom: none;
        }

        .flow-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .flow-value {
            font-size: 16px;
            font-weight: 600;
        }

        .flow-value.inflow { color: #ef4444; }
        .flow-value.outflow { color: #10b981; }

        .flow-bar-container {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .flow-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .flow-bar.main { background: linear-gradient(90deg, var(--accent-red), #f87171); }
        .flow-bar.retail { background: linear-gradient(90deg, var(--accent-blue), #60a5fa); }

        /* 页脚 */
        footer {
            margin-top: 40px;
            padding: 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 13px;
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .stock-cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .nav-links {
                display: none;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-radar"></i>
            <h1>Radar 趋势波段决策中心</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if request.path in ['/', '/swing'] %}active{% endif %}">
                <i class="fas fa-compass"></i> 核心决策
            </a>
            <a href="/overview" class="{% if request.path == '/overview' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> 监控概览
            </a>
            <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">
                <i class="fas fa-file-alt"></i> 日志
            </a>
            <a href="/api/status" target="_blank">
                <i class="fas fa-code"></i> API
            </a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}

        <footer>
            <p><i class="fas fa-heart" style="color: var(--accent-red);"></i> Radar 监控系统 v2.0 | 数据更新时间: <span id="footer-time">--</span></p>
        </footer>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('footer-time').textContent = now.toLocaleString('zh-CN');
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ===== SSE 实时推送支持 (v3.0 新增) =====
        window.SSEConnection = (function() {
            let eventSource = null;
            let reconnectTimer = null;
            let listeners = {};
            let connected = false;

            function connect() {
                if (eventSource) {
                    eventSource.close();
                }

                console.log('[SSE] Connecting...');
                eventSource = new EventSource('/api/stream');

                eventSource.onopen = function() {
                    console.log('[SSE] Connected');
                    connected = true;
                };

                eventSource.onmessage = function(e) {
                    // 处理无事件类型的消息
                };

                eventSource.addEventListener('init', function(e) {
                    const data = JSON.parse(e.data);
                    dispatch('init', data);
                });

                eventSource.addEventListener('tick', function(e) {
                    const data = JSON.parse(e.data);
                    dispatch('tick', data);
                });

                eventSource.addEventListener('heartbeat', function(e) {
                    dispatch('heartbeat', JSON.parse(e.data));
                });

                eventSource.onerror = function(e) {
                    console.log('[SSE] Error, will reconnect...');
                    connected = false;
                    eventSource.close();
                    // 3秒后重连
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, 3000);
                };
            }

            function dispatch(eventType, data) {
                const handlers = listeners[eventType] || [];
                handlers.forEach(fn => {
                    try { fn(data); } catch(e) { console.error(e); }
                });
            }

            return {
                on: function(eventType, handler) {
                    if (!listeners[eventType]) listeners[eventType] = [];
                    listeners[eventType].push(handler);
                },
                off: function(eventType, handler) {
                    if (!listeners[eventType]) return;
                    const idx = listeners[eventType].indexOf(handler);
                    if (idx >= 0) listeners[eventType].splice(idx, 1);
                },
                start: connect,
                isConnected: function() { return connected; }
            };
        })();

        // 自动启动 SSE
        if (typeof EventSource !== 'undefined') {
            window.SSEConnection.start();
        } else {
            console.warn('EventSource not supported');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
